<style>
  :root{ --bg:#14171c; --panel:#1c2027; --line:#2c323b; --text:#dfe4ea; --dim:#8a919c;
         --ok:#4bd07a; --ng:#ff5f57; --warn:#e8a34c; }
  *{ box-sizing:border-box }
  body{ margin:0; padding:14px; background:var(--bg); color:var(--text);
        font:14px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif }
  h1{ font-size:17px; margin:0 0 4px }
  p.lead{ color:var(--dim); font-size:12px; margin:0 0 14px }
  .verdict{ border-radius:10px; padding:14px; margin-bottom:14px; font-weight:700; font-size:16px;
            border:2px solid var(--line); background:var(--panel) }
  .verdict.ok{ border-color:var(--ok); color:var(--ok) }
  .verdict.ng{ border-color:var(--ng); color:var(--ng) }
  .verdict.warn{ border-color:var(--warn); color:var(--warn) }
  .verdict small{ display:block; font-weight:400; font-size:12px; color:var(--text); margin-top:6px }
  table{ width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden }
  td{ padding:8px 10px; border-top:1px solid var(--line); vertical-align:top; font-size:13px }
  tr:first-child td{ border-top:none }
  td.k{ color:var(--dim); width:44%; word-break:break-word }
  td.v{ word-break:break-word }
  .ok{ color:var(--ok) } .ng{ color:var(--ng) } .warn{ color:var(--warn) }
  .sec{ margin:16px 0 6px; color:var(--dim); font-size:11px; letter-spacing:.08em }
  button{ width:100%; margin-top:14px; padding:12px; font-size:15px; border-radius:8px;
          border:1px solid var(--line); background:var(--panel); color:var(--text) }
  button:active{ background:#252a33 }
  textarea{ width:100%; height:140px; margin-top:10px; background:#0f1216; color:var(--dim);
            border:1px solid var(--line); border-radius:6px; padding:8px; font:11px/1.5 monospace }
  canvas{ display:none }
</style></head><body>
<p style="margin:0 0 12px;font-size:13px"><a href="../" style="color:#8a919c">← Nishikie Lab トップへ</a></p>
<h1>Nishikie Lab 環境チェック</h1>
<p class="lead">このページはお使いの端末で Nishikie Lab が動くかを調べるだけのものです。何も保存せず、どこへも送信しません。<br>
不具合のお問い合わせの際は、下のボタンで結果をコピーして添えていただくと、調査が早く進みます。</p>
<div id="verdict" class="verdict">調べています…
  <small>この表示のまま何も出ない場合、スクリプトが動かない場所で開いています。
  メールやチャットアプリの「プレビュー」ではなく、<b>一度端末に保存してから
  Safari や Chrome で直接開いて</b>ください。</small></div>
<div id="out"></div>
<button id="copy">結果をコピー</button>
<textarea id="raw" readonly></textarea>
<canvas id="cv" width="64" height="64"></canvas>
<script>
// このページの使命は「どんな壊れ方をした環境でも、必ず何かを報告する」こと。
// ①途中で例外が出ても止まらない(各節をtryで包む+onerrorで拾う)
// ②万一finishに届かなくても3秒の見張りが強制的に結果を出す
// ③そもそもJSが動かない環境(メールやチャットアプリの添付プレビュー)では
//   noscript相当の案内をverdictに焼き込めないため、下の「開き方」をページに常設する
(function(){
  const rows = [];
  let finished = false;
  window.onerror = function(msg, src, line){
    try{
      rows.push({sec: 'エラー'});
      rows.push({k: 'スクリプトエラー', v: msg + ' (行' + line + ')', cls: 'ng'});
      finish(true);
    }catch(e){}
    return false;
  };
  const add = (k, v, cls) => rows.push({k, v: String(v), cls: cls || ''});
  const sec = (t) => rows.push({sec: t});
  const yes = b => b ? 'はい' : 'いいえ';

  sec('端末');
  add('画面', screen.width + '×' + screen.height + ' / DPR ' + (window.devicePixelRatio || 1));
  add('ブラウザ', navigator.userAgent);

  // --- WebGL2 ---
  sec('WebGL2（これが無いと動きません）');
  const cv = document.getElementById('cv');
  let gl = null, fatal = false, warn = false;
  try{ gl = cv.getContext('webgl2', {antialias:false}); }catch(e){}
  add('WebGL2', yes(!!gl), gl ? 'ok' : 'ng');
  if(!gl){ fatal = true; }
  else{
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    add('GPU', dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '(非公開)');
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    add('最大テクスチャ', maxTex + 'px', maxTex >= 4096 ? 'ok' : 'warn');
    if(maxTex < 4096) warn = true;

    // 16bit float を「描き込み先」にできるか。Nishikie Lab のレイヤーはこれが前提
    sec('16bitフロートのレイヤー（本体の土台）');
    const efl = gl.getExtension('EXT_color_buffer_float');
    const ehf = gl.getExtension('EXT_color_buffer_half_float');
    add('EXT_color_buffer_float', yes(!!efl), efl ? 'ok' : 'warn');
    add('EXT_color_buffer_half_float', yes(!!ehf), ehf ? 'ok' : 'warn');
    // 宣言ではなく実際に作って確かめる(拡張が無くても通る実装がある)
    let renderable = false, readback = null;
    try{
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 8, 8, 0, gl.RGBA, gl.HALF_FLOAT, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      renderable = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      if(renderable){
        gl.viewport(0, 0, 8, 8);
        gl.clearColor(0.25, 0.5, 0.75, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const px = new Float32Array(4);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
        readback = (gl.getError() === gl.NO_ERROR)
          ? [px[0].toFixed(2), px[1].toFixed(2), px[2].toFixed(2)].join(', ') : '読み出し不可';
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }catch(e){ readback = 'エラー: ' + e.message; }
    add('RGBA16Fへ描ける', yes(renderable), renderable ? 'ok' : 'ng');
    add('書いた値を読み戻せる', readback === null ? '—' : readback,
        (readback && readback.indexOf('0.25') === 0) ? 'ok' : 'warn');
    if(!renderable) fatal = true;
    if(readback && readback.indexOf('0.25') !== 0) warn = true;

    sec('その他のGL');
    add('float補間 (OES_texture_float_linear)', yes(!!gl.getExtension('OES_texture_float_linear')));
    add('最大テクスチャユニット', gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS));
    add('最大uniformベクタ(頂点)', gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS));
  }

  // --- 保存まわり ---
  sec('保存まわり');
  let ls = false;
  try{ localStorage.setItem('__t','1'); ls = localStorage.getItem('__t') === '1'; localStorage.removeItem('__t'); }catch(e){}
  add('localStorage', yes(ls), ls ? 'ok' : 'warn');
  // サンドボックス環境では indexedDB のプロパティアクセス自体が例外を投げることがある
  let idb = false; try{ idb = (typeof indexedDB !== 'undefined') && !!indexedDB; }catch(e){}
  add('IndexedDB（自動バックアップ）', yes(idb), idb ? 'ok' : 'warn');
  let fsa = false; try{ fsa = typeof window.showSaveFilePicker === 'function'; }catch(e){}
  add('ファイルへ直接保存', yes(fsa), fsa ? 'ok' : 'warn');
  add('gzip圧縮 (CompressionStream)', yes(typeof CompressionStream !== 'undefined'));
  add('secure context', yes(window.isSecureContext));

  // --- 入力 ---
  sec('入力');
  add('Pointer Events', yes(typeof PointerEvent !== 'undefined'),
      typeof PointerEvent !== 'undefined' ? 'ok' : 'ng');
  add('タッチ点数', navigator.maxTouchPoints || 0);
  if(typeof PointerEvent === 'undefined') fatal = true;

  // --- 空き容量 ---
  const finish = (isError)=>{
    if(finished) return;
    finished = true;
    const out = document.getElementById('out');
    let html = '';
    for(const r of rows){
      if(r.sec){ html += '</table><div class="sec">' + r.sec + '</div><table>'; continue; }
      html += '<tr><td class="k">' + r.k + '</td><td class="v ' + r.cls + '">' + r.v + '</td></tr>';
    }
    out.innerHTML = ('<table>' + html + '</table>').replace('<table></table>', '');

    const v = document.getElementById('verdict');
    if(isError){
      v.className = 'verdict ng';
      v.innerHTML = '× チェックの途中でエラーが出ました<small>ここまでの結果とエラー内容を' +
        '控えておいてください。お問い合わせの際に添えていただくと調査の手がかりになります。</small>';
    }else if(fatal){
      v.className = 'verdict ng';
      v.innerHTML = '× この端末では動きません<small>WebGL2 か 16bitフロートのレイヤーが使えません。' +
        '別の端末・別のブラウザでのご利用をご検討ください。</small>';
    }else if(warn){
      v.className = 'verdict warn';
      v.innerHTML = '△ 動きますが制限がありそうです<small>お問い合わせの際は、下の橙色の項目を添えてください。</small>';
    }else{
      v.className = 'verdict ok';
      v.innerHTML = '○ 問題なく動きそうです<small>そのままお使いいただけます。</small>';
    }
    const text = rows.map(r => r.sec ? '\n[' + r.sec + ']' : r.k + ': ' + r.v).join('\n');
    document.getElementById('raw').value =
      'Nishikie Lab 環境チェック / ' + (fatal ? 'NG' : warn ? 'WARN' : 'OK') + text;
  };

  // Promiseが「解決も拒否もしない」環境で無言のまま止まらないよう、3秒の見張りを置く
  setTimeout(()=>{ if(!finished){ add('注記', '空き容量の取得が3秒応答しなかったため省略', 'warn'); finish(); } }, 3000);
  let est = null;
  try{ est = navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : null; }catch(e){}
  if(est){
    est.then(e=>{
      sec('空き容量');
      add('ブラウザの割当', Math.round((e.quota || 0) / 1048576) + ' MB');
      add('使用中', Math.round((e.usage || 0) / 1048576) + ' MB');
      finish();
    }).catch(()=>finish());
  }else finish();

  document.getElementById('copy').addEventListener('click', ()=>{
    const ta = document.getElementById('raw');
    ta.select(); ta.setSelectionRange(0, 99999);
    const done = ()=>{ const b = document.getElementById('copy');
      b.textContent = 'コピーしました'; setTimeout(()=> b.textContent = '結果をコピー', 1600); };
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, ()=>{ document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  });
})();
</script>
